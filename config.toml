baseURL = '/'
languageCode = 'en-us'
title = 'Pedro Caetano - Blog'
theme = "PaperMod"

[outputs]
    home = [ "HTML", "RSS", "JSON" ]

[caches]
  [caches.images]
    dir = ':cacheDir/images'
    
[pagination]
  pagerSize = 5

[params]
  contentTypeName = "posts"
  themeColor = "red"
  #change this if I want more item in the navbar
  fullWidthTheme = false 
  centerTheme = true 
  ShowCodeCopyButtons = true
  [params.homeInfoParams]
    title = "Welcome"
    Content = "Here, you can find my latest posts. Don't forget to check out the other pages."

[languages]
    [languages.en]
	  [languages.en.params]
	    title = "Pedro Caetano - Blog"
	    subtitle = "This is my personal blog where I share some of my tech knowledge."
	    keywords = ["coding", "privacy", "FOOS", "free and open source", "hacking"]
	    copyright = ""
	    menuMore = "Show more"
	    readMore = "Read more"
	    readOtherPosts = "Read other posts"

	    [languages.en.params.logo]
	      logoText = "Pedro Caetano"
	      logoHomeLink = "/"

	    [languages.en.menu]
	    #add more of these if I want more pages
	      [[languages.en.menu.main]]
		identifier = "home"
		name = "Home"
		url = "/"
	      [[languages.en.menu.main]]
		identifier = "about"
		name = "About"
		url = "/about"
	      [[languages.en.menu.main]]
		identifier = "cv"
		name = "CV"
		url = "/cv"
            [[languages.en.menu.main]]
        identifier = "search"
        name = "Search"
        url = "/search"
            [[languages.en.menu.main]]
        identifier = "archive"
        name = "Archive"
        url = "/archives"
